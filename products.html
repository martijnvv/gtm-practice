  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fffaf2;
      margin: 0;
      padding: 0;
      color: #2d2926;
    }

    header {
      background-color: #b72c24;
      padding: 20px;
      color: white;
      text-align: center;
    }

    nav a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .container > h2 {
      text-align: center;
      font-size: 30px;
      color: #b72c24;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      width: 250px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-card h2 {
      font-size: 19px;
      margin: 15px 0 5px;
      color: #b72c24;
    }

    .price {
      color: #333;
      font-weight: bold;
      margin: 10px 0;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background-color: #2f7d32;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      color: white;
    }

    .btn:hover {
      background-color: #256428;
    }

    .disabled {
      background-color: #aaa;
    }

    footer {
      text-align: center;
      margin: 60px 0 20px;
      color: #999;
    }

<header>
  <h1>Roman's Pizza Shop 🍕</h1>

  <nav>
    <a href="index.html">Home</a>

        alt="Margherita Pizza"
      >

      <h2>Margherita Pizza</h2>

      <div class="price">
        €12.99
      </div>

      <a
        href="index.html"
        class="btn"
        onclick="dataLayer.push({
          event: 'select_item',
          ecommerce: {
            item_list_id: 'pizza_menu',
            item_list_name: 'Featured Pizzas',
            items: [{
              item_id: 'pizza_margherita',
              item_name: 'Margherita Pizza',
              item_category: 'Pizza',
              price: 12.99,
              index: 0
            }]
          }
        });"
      >
        View Pizza
      </a>

    </div>


    <!-- Pizza 2 -->

    <div class="product-card">

      <img
        src="https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=700&q=80"
        alt="Pepperoni Pizza"
      >

      <h2>Pepperoni Pizza</h2>

      <div class="price">
        €14.99
      </div>

      <a href="#" class="btn disabled">
        Coming Soon
      </a>

    </div>


    <!-- Pizza 3 -->

    <div class="product-card">

      <img
        src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=700&q=80"
        alt="Quattro Formaggi Pizza"
      >

      <div class="price">
        €15.99
      </div>
